<text x="1078" y="138" font-family="Menlo, monospace" font-size="13.5">name = figma-v2</text>
<text x="1078" y="160" font-family="Menlo, monospace" font-size="13.5">timeout = 5000</text>
<text x="1078" y="186" font-size="15" font-weight="700" fill="#ff6b6b">Your fix is lost</text>
<rect x="10" y="274" width="1220" height="200" rx="10" fill="none" stroke="#4cc38a" stroke-width="1.5" stroke-dasharray="6 5"/>
