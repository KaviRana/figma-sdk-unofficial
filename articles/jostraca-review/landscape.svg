<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" font-family="Helvetica, Arial, sans-serif" fill="#eeeeee">
<rect width="100%" height="100%" fill="#111111"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#bbbbbb"/></marker></defs>
<rect x="10" y="24" width="1220" height="200" rx="10" fill="none" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="28" y="56" font-weight="700" font-size="21" fill="#ff6b6b">Without Jostraca</text>
