<text x="40" y="110" font-weight="700" font-size="16">1. Spec v1</text>
<text x="40" y="142" font-family="Menlo, monospace" font-size="13.5">name: figma</text>
<text x="40" y="166" font-family="Menlo, monospace" font-size="13.5" fill="#9a9a9a">timeout: 5000</text>
<line x1="203" y1="140" x2="226" y2="140" stroke="#bbbbbb" stroke-width="2" marker-end="url(#a)"/>
<rect x="230" y="80" width="172" height="120" rx="8" fill="#1e1e1e" stroke="#555"/>
<text x="242" y="110" font-weight="700" font-size="16">2. Generate</text>
<text x="242" y="142" font-family="Menlo, monospace" font-size="13.5">writes client.js</text>
<line x1="405" y1="140" x2="428" y2="140" stroke="#bbbbbb" stroke-width="2" marker-end="url(#a)"/>
<rect x="432" y="80" width="172" height="120" rx="8" fill="#1e1e1e" stroke="#555"/>
<text x="444" y="110" font-weight="700" font-size="16">3. Engineer edits</text>
<text x="444" y="142" font-family="Menlo, monospace" font-size="13.5">timeout = 30000</text>
<text x="444" y="166" font-family="Menlo, monospace" font-size="13.5" fill="#9a9a9a">// Figma is slow</text>
<line x1="607" y1="140" x2="630" y2="140" stroke="#bbbbbb" stroke-width="2" marker-end="url(#a)"/>
<rect x="634" y="80" width="172" height="120" rx="8" fill="#1e1e1e" stroke="#555"/>
<text x="646" y="110" font-weight="700" font-size="16">4. Spec v2</text>
<text x="646" y="142" font-family="Menlo, monospace" font-size="13.5">name: figma-v2</text>
<text x="646" y="166" font-family="Menlo, monospace" font-size="13.5" fill="#9a9a9a">timeout: 5000</text>
<line x1="809" y1="140" x2="832" y2="140" stroke="#bbbbbb" stroke-width="2" marker-end="url(#a)"/>
<rect x="836" y="80" width="200" height="120" rx="8" fill="#3a1518" stroke="#ff6b6b" stroke-width="2"/>
<text x="848" y="110" font-weight="700" font-size="16">5. Generate again</text>
<text x="848" y="138" font-size="14">writes every file again</text>
<text x="848" y="160" font-size="14">from spec v2 and</text>
<text x="848" y="182" font-size="14">ignores your edit</text>
<line x1="1039" y1="140" x2="1062" y2="140" stroke="#bbbbbb" stroke-width="2" marker-end="url(#a)"/>
<rect x="1066" y="80" width="146" height="120" rx="8" fill="#3a1518" stroke="#ff6b6b" stroke-width="2"/>
