<text x="40" y="416" font-family="Menlo, monospace" font-size="13.5" fill="#9a9a9a">timeout: 5000</text>
<line x1="203" y1="390" x2="226" y2="390" stroke="#bbbbbb" stroke-width="2" marker-end="url(#a)"/>
<rect x="230" y="330" width="172" height="120" rx="8" fill="#1e1e1e" stroke="#555"/>
<text x="242" y="360" font-weight="700" font-size="16">2. Generate</text>
<text x="242" y="392" font-family="Menlo, monospace" font-size="13.5">writes client.js</text>
<line x1="405" y1="390" x2="428" y2="390" stroke="#bbbbbb" stroke-width="2" marker-end="url(#a)"/>
<rect x="432" y="330" width="172" height="120" rx="8" fill="#1e1e1e" stroke="#555"/>
<text x="444" y="360" font-weight="700" font-size="16">3. Engineer edits</text>
<text x="444" y="392" font-family="Menlo, monospace" font-size="13.5">timeout = 30000</text>
<text x="444" y="416" font-family="Menlo, monospace" font-size="13.5" fill="#9a9a9a">// Figma is slow</text>
<line x1="607" y1="390" x2="630" y2="390" stroke="#bbbbbb" stroke-width="2" marker-end="url(#a)"/>
<rect x="634" y="330" width="172" height="120" rx="8" fill="#1e1e1e" stroke="#555"/>
<text x="646" y="360" font-weight="700" font-size="16">4. Spec v2</text>
<text x="646" y="392" font-family="Menlo, monospace" font-size="13.5">name: figma-v2</text>
<text x="646" y="416" font-family="Menlo, monospace" font-size="13.5" fill="#9a9a9a">timeout: 5000</text>
<line x1="809" y1="390" x2="832" y2="390" stroke="#bbbbbb" stroke-width="2" marker-end="url(#a)"/>
<rect x="836" y="330" width="200" height="120" rx="8" fill="#123020" stroke="#4cc38a" stroke-width="2"/>
<text x="848" y="360" font-weight="700" font-size="16">5. Generate again</text>
<text x="848" y="388" font-size="14">compares its last copy,</text>
<text x="848" y="410" font-size="14">your file and the new</text>
<text x="848" y="432" font-size="14">output, keeps your line</text>
