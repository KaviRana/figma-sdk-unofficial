<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <g font-size="20">
    <rect x="30" y="30" width="280" height="110" rx="8" fill="#f2f2f2" stroke="#333"/>
    <text x="50" y="65" font-weight="700">1. Last generated</text>
    <text x="50" y="95" fill="#555">.jostraca/generated/</text>
    <text x="50" y="122" font-family="Menlo, monospace" font-size="17">timeout = 5000</text>
    <rect x="360" y="30" width="280" height="110" rx="8" fill="#fff6d6" stroke="#333"/>
    <text x="380" y="65" font-weight="700">2. On disk now</text>
    <text x="380" y="95" fill="#555">your hand edit</text>
    <text x="380" y="122" font-family="Menlo, monospace" font-size="17">timeout = 30000</text>
    <rect x="690" y="30" width="280" height="110" rx="8" fill="#e6f0ff" stroke="#333"/>
    <text x="710" y="65" font-weight="700">3. New output</text>
    <text x="710" y="95" fill="#555">from the changed spec</text>
    <text x="710" y="122" font-family="Menlo, monospace" font-size="17">name = 'figma-v2'</text>
    <line x1="170" y1="140" x2="440" y2="270" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="500" y1="140" x2="500" y2="270" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="830" y1="140" x2="560" y2="270" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <rect x="300" y="275" width="400" height="120" rx="8" fill="#e8f7e8" stroke="#333"/>
    <text x="320" y="310" font-weight="700">merge: keeps both changes</text>
    <text x="320" y="342" font-family="Menlo, monospace" font-size="17">name = 'figma-v2'</text>
    <text x="320" y="370" font-family="Menlo, monospace" font-size="17">timeout = 30000</text>
    <text x="30" y="425" fill="#b00020" font-size="18">Without box 1 (a fresh clone, or merge switched off), the hand edit is overwritten.</text>
  </g>
</svg>
